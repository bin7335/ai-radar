<!DOCTYPE html>
<html lang="ko" class="antialiased text-gray-900 bg-white dark:bg-zinc-950 dark:text-zinc-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Radar - News & Insights</title>
    <!-- Tailwind CSS (가장 가벼운 CDN 방식) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 고급스러운 타이포그래피를 위한 Pretendard 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <script>
        tailwind.config = {
            darkMode: 'media', // 사용자의 OS 설정(라이트/다크)에 자동으로 맞춤
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
        @media (prefers-color-scheme: dark) {
            ::-webkit-scrollbar-thumb { background: #3f3f46; }
        }
        
        /* 절제된 호버 애니메이션 (Linear 스타일) */
        .arrow-icon {
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.2s ease-out;
        }
        .feed-row:hover .arrow-icon {
            opacity: 1;
            transform: translateX(0);
        }
    
        /* 다이내믹 UI 효과 */
        .col-wrapper:hover .feed-row {
            opacity: 0.3;
            filter: grayscale(40%);
        }
        .feed-row {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .col-wrapper .feed-row:hover {
            opacity: 1 !important;
            filter: none !important;
            transform: translateY(-4px) scale(1.02);
            z-index: 10;
            background-color: var(--tw-bg-opacity, #ffffff);
            box-shadow: 0 12px 24px -10px rgba(0,0,0,0.1);
        }
        @media (prefers-color-scheme: dark) {
            .col-wrapper .feed-row:hover {
                background-color: var(--tw-bg-opacity, #09090b);
                box-shadow: 0 12px 24px -10px rgba(0,0,0,0.5);
            }
        }
        
        @keyframes cascadeFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-cascade {
            animation: cascadeFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
</style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-blue-100 selection:text-blue-900 dark:selection:bg-blue-900 dark:selection:text-white">
    <main class="max-w-[1920px] w-full mx-auto px-6 py-20 flex-1 break-keep">
        <header class="mb-12 border-b border-zinc-200 dark:border-zinc-800 pb-8">
            <h1 class="text-3xl font-bold tracking-tight mb-3">AI Radar</h1>
            <p class="text-zinc-500 dark:text-zinc-400 text-sm">오픈소스, 에이전트 생태계, 인사이트 Briefing</p>
            <p id="feed-status" class="text-xs text-zinc-500 mt-3" role="status">갱신 상태 확인 중...</p>
        </header>

        <!-- 카테고리별 4단 레이아웃 (Kanban 보드) -->
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-8 xl:gap-12 xl:h-[calc(100vh-14rem)]">
            <!-- 1. 오픈소스 -->
            <div class="flex flex-col xl:overflow-hidden col-wrapper relative">
                <h3 class="text-sm font-bold text-zinc-900 dark:text-zinc-100 uppercase tracking-widest border-b-2 border-zinc-900 dark:border-zinc-100 pb-3 mb-2 shrink-0 sticky top-0 z-20 bg-white/75 dark:bg-[#09090b]/75 backdrop-blur-md pt-2 -mt-2">오픈소스</h3>
                <div id="col-opensource" class="flex flex-col xl:overflow-y-auto pr-1 pb-8">
                    
                    <!-- Skeleton Loader -->
                    <div class="flex flex-col gap-4 mt-2">
                        <div class="animate-pulse flex space-x-4 p-4 border border-zinc-100 dark:border-zinc-800 rounded-lg">
                            <div class="flex-1 space-y-4 py-1">
                                <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-3/4"></div>
                                <div class="space-y-2">
                                    <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded"></div>
                                    <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-5/6"></div>
                                </div>
                            </div>
                        </div>
                        <div class="animate-pulse flex space-x-4 p-4 border border-zinc-100 dark:border-zinc-800 rounded-lg opacity-50">
                            <div class="flex-1 space-y-4 py-1">
                                <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-2/3"></div>
                                <div class="space-y-2">
                                    <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-full"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            
            <!-- 2. 뉴스 -->
            <div class="flex flex-col xl:overflow-hidden col-wrapper relative">
                <h3 class="text-sm font-bold text-zinc-900 dark:text-zinc-100 uppercase tracking-widest border-b-2 border-zinc-900 dark:border-zinc-100 pb-3 mb-2 shrink-0 sticky top-0 z-20 bg-white/75 dark:bg-[#09090b]/75 backdrop-blur-md pt-2 -mt-2">뉴스</h3>
                <div id="col-news" class="flex flex-col xl:overflow-y-auto pr-1 pb-8">
                    
                    <!-- Skeleton Loader -->
                    <div class="flex flex-col gap-4 mt-2">
                        <div class="animate-pulse flex space-x-4 p-4 border border-zinc-100 dark:border-zinc-800 rounded-lg">
                            <div class="flex-1 space-y-4 py-1">
                                <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-3/4"></div>
                                <div class="space-y-2">
                                    <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded"></div>
                                    <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-5/6"></div>
                                </div>
                            </div>
                        </div>
                        <div class="animate-pulse flex space-x-4 p-4 border border-zinc-100 dark:border-zinc-800 rounded-lg opacity-50">
                            <div class="flex-1 space-y-4 py-1">
                                <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-2/3"></div>
                                <div class="space-y-2">
                                    <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-full"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            
            <!-- 3. 정보/꿀팁 -->
            <div class="flex flex-col xl:overflow-hidden col-wrapper relative">
                <h3 class="text-sm font-bold text-zinc-900 dark:text-zinc-100 uppercase tracking-widest border-b-2 border-zinc-900 dark:border-zinc-100 pb-3 mb-2 shrink-0 sticky top-0 z-20 bg-white/75 dark:bg-[#09090b]/75 backdrop-blur-md pt-2 -mt-2">꿀팁/정보</h3>
                <div id="col-info" class="flex flex-col xl:overflow-y-auto pr-1 pb-8">
                    
                    <!-- Skeleton Loader -->
                    <div class="flex flex-col gap-4 mt-2">
                        <div class="animate-pulse flex space-x-4 p-4 border border-zinc-100 dark:border-zinc-800 rounded-lg">
                            <div class="flex-1 space-y-4 py-1">
                                <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-3/4"></div>
                                <div class="space-y-2">
                                    <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded"></div>
                                    <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-5/6"></div>
                                </div>
                            </div>
                        </div>
                        <div class="animate-pulse flex space-x-4 p-4 border border-zinc-100 dark:border-zinc-800 rounded-lg opacity-50">
                            <div class="flex-1 space-y-4 py-1">
                                <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-2/3"></div>
                                <div class="space-y-2">
                                    <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-full"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            
            <!-- 4. 커뮤니티 -->
            <div class="flex flex-col xl:overflow-hidden col-wrapper relative">
                <h3 class="text-sm font-bold text-zinc-900 dark:text-zinc-100 uppercase tracking-widest border-b-2 border-zinc-900 dark:border-zinc-100 pb-3 mb-2 shrink-0 sticky top-0 z-20 bg-white/75 dark:bg-[#09090b]/75 backdrop-blur-md pt-2 -mt-2">커뮤니티</h3>
                <div id="col-community" class="flex flex-col xl:overflow-y-auto pr-1 pb-8">
                    
                    <!-- Skeleton Loader -->
                    <div class="flex flex-col gap-4 mt-2">
                        <div class="animate-pulse flex space-x-4 p-4 border border-zinc-100 dark:border-zinc-800 rounded-lg">
                            <div class="flex-1 space-y-4 py-1">
                                <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-3/4"></div>
                                <div class="space-y-2">
                                    <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded"></div>
                                    <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-5/6"></div>
                                </div>
                            </div>
                        </div>
                        <div class="animate-pulse flex space-x-4 p-4 border border-zinc-100 dark:border-zinc-800 rounded-lg opacity-50">
                            <div class="flex-1 space-y-4 py-1">
                                <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-2/3"></div>
                                <div class="space-y-2">
                                    <div class="h-2 bg-zinc-200 dark:bg-zinc-800 rounded w-full"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <footer class="py-12 text-center text-xs text-zinc-400 dark:text-zinc-600 mt-12 border-t border-zinc-100 dark:border-zinc-800">
        Powered by GitHub Actions · OpenRouter / Gemini
    </footer>

    <script>
        function parseSummary(markdown) {
            const lines = (markdown || '').split('\n');
            let oneLine = "";
            let implication = "";
            let category = "뉴스";
            
            lines.forEach(line => {
                if (line.includes('한줄요약**:')) oneLine = line.split('**:')[1]?.trim() || line.replace('**- 한줄요약**:', '').trim();
                if (line.includes('한 줄 요약**:')) oneLine = line.split('**:')[1]?.trim() || line.replace('**- 한 줄 요약**:', '').trim();
                if (line.includes('인사이트**:')) implication = line.split('**:')[1]?.trim() || line.replace('**- 인사이트**:', '').trim();
                if (line.includes('업무 시사점**:')) implication = line.split('**:')[1]?.trim() || line.replace('**- 업무 시사점**:', '').trim();
                if (line.includes('카테고리:')) category = line.split('카테고리:')[1]?.trim() || "뉴스";
            });
            
            category = category.replace(/\[|\]/g, '').trim();
            return { oneLine, implication, category, raw: markdown };
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }

        function safeUrl(value) {
            try {
                const url = new URL(value);
                return ['https:', 'http:'].includes(url.protocol) ? url.href : null;
            } catch (_) {
                return null;
            }
        }

        function relativeTime(dateString) {
            const date = new Date(dateString);
            if (Number.isNaN(date.getTime())) return '날짜 미상';
            const now = new Date();
            const diffInSeconds = Math.max(0, Math.floor((now - date) / 1000));
            
            if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)}분 전`;
            if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)}시간 전`;
            return `${Math.floor(diffInSeconds / 86400)}일 전`;
        }

        function renderStatus(status, data) {
            const el = document.getElementById('feed-status');
            const lastSuccess = status?.last_successful_run_at || null;
            const newest = data.reduce((best, item) => {
                const stamp = new Date(item.last_seen_at || item.fetched_at || item.published_at).getTime();
                return Number.isFinite(stamp) ? Math.max(best, stamp) : best;
            }, 0);
            const stamp = lastSuccess ? new Date(lastSuccess).getTime() : newest;
            const stale = !stamp || Date.now() - stamp > 12 * 60 * 60 * 1000;
            const failedSources = status?.sources ? Object.entries(status.sources)
                .filter(([name, state]) => name !== 'DCInside' && !state.ok)
                .map(([name]) => name) : [];
            if (status?.healthy && !stale) {
                el.className = 'text-xs text-emerald-600 dark:text-emerald-400 mt-3';
                const pending = status.summaries_pending ? ` · 요약 대기 ${status.summaries_pending}건` : '';
                el.textContent = `정상 갱신 · ${relativeTime(lastSuccess)} · ${status.feed_count}건${pending}`;
            } else {
                el.className = 'text-xs text-amber-700 dark:text-amber-400 mt-3';
                const reason = failedSources.length ? `수집 확인 필요: ${failedSources.join(', ')}` : '갱신 확인 필요';
                el.textContent = `${reason} · 마지막 정상 갱신 ${stamp ? relativeTime(new Date(stamp).toISOString()) : '기록 없음'}`;
            }
        }

        function renderFeed(data) {
            const cols = {
                '오픈소스': document.getElementById('col-opensource'),
                '뉴스': document.getElementById('col-news'),
                '정보': document.getElementById('col-info'),
                '커뮤니티': document.getElementById('col-community')
            };

            Object.values(cols).forEach(col => col.innerHTML = '');

            // 같은 날짜의 GitHub 항목은 이번 주 획득 스타로 정렬한다.
            const sortedData = [...data].sort((a, b) => {
                const dateA = new Date(a.source === 'GitHub Trending' ? (a.last_seen_at || a.fetched_at) : (a.published_at || a.fetched_at)).getTime() || 0;
                const dateB = new Date(b.source === 'GitHub Trending' ? (b.last_seen_at || b.fetched_at) : (b.published_at || b.fetched_at)).getTime() || 0;
                const dayDiff = Math.floor(dateB / 86400000) - Math.floor(dateA / 86400000);
                if (dayDiff) return dayDiff;
                const pA = parseInt(a.points) || 0;
                const pB = parseInt(b.points) || 0;
                return pB - pA || dateB - dateA;
            });

            // 카테고리별 순위 추적
            const ranks = { '오픈소스': 0, '뉴스': 0, '정보': 0, '커뮤니티': 0 };

            sortedData.forEach(item => {
                const parsed = parseSummary(item.summary_md);
                const category = item.category || parsed.category;
                const oneLine = item.one_line || parsed.oneLine;
                const implication = item.insight || parsed.implication;
                const isGithub = item.source === 'GitHub Trending';
                const timeAgo = isGithub ? `확인 ${relativeTime(item.last_seen_at || item.fetched_at)}` : relativeTime(item.published_at || item.fetched_at);
                const link = safeUrl(item.url);
                if (!link) return;
                
                let domain = "";
                try { domain = new URL(link).hostname.replace('www.', ''); } catch(e) {}
                const sourceText = item.source ? `${item.source} · ${domain}` : domain;
                
                let targetKey = '뉴스'; 
                if (category.includes('오픈소스')) targetKey = '오픈소스';
                else if (category.includes('정보') || category.includes('꿀팁')) targetKey = '정보';
                else if (category.includes('커뮤니티')) targetKey = '커뮤니티';

                ranks[targetKey]++;
                const rank = ranks[targetKey];

                const el = document.createElement('a');
                el.href = link;
                el.target = "_blank";
                el.rel = "noopener noreferrer";
                // 카드박스(그림자, 테두리) 대신 밑줄만 남겨 가독성 극대화
                el.className = "feed-row animate-cascade group block py-5 border-b border-zinc-100 dark:border-zinc-800/60 transition-colors -mx-3 px-3 rounded-xl sm:rounded-lg bg-white dark:bg-[#09090b]";
                el.style.animationDelay = (rank * 0.08) + 's';
                
                const pointsText = isGithub && Number.isFinite(Number(item.weekly_stars))
                    ? `⭐ +${Number(item.weekly_stars).toLocaleString()} / 주`
                    : isGithub ? `누적 ⭐ ${Number(item.points || 0).toLocaleString()}`
                    : Number(item.points) > 0 ? `🔥 ${Number(item.points).toLocaleString()}` : '';
                const pointsLabel = pointsText ? `<span class="px-1.5 py-0.5 bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 rounded text-[10px] font-bold whitespace-nowrap flex-shrink-0">${escapeHtml(pointsText)}</span>` : '';

                el.innerHTML = `
                    <div class="flex flex-col gap-2">
                        <div class="flex items-center gap-2 text-[11px] text-zinc-500 dark:text-zinc-400">
                            <span class="text-[10px] font-extrabold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-1.5 py-0.5 rounded tracking-wider whitespace-nowrap flex-shrink-0">TOP ${rank}</span>
                            <span class="font-semibold text-zinc-700 dark:text-zinc-300 truncate">${escapeHtml(sourceText)}</span>
                            <span class="flex-shrink-0">•</span>
                            <span class="flex-shrink-0 whitespace-nowrap">${escapeHtml(timeAgo)}</span>
                            ${pointsLabel}
                        </div>
                        
                        <h2 class="text-base font-bold leading-snug text-zinc-900 dark:text-zinc-100 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
                            ${escapeHtml(String(item.title || '').replace(/^\[.*?\]\s*/, ''))}
                        </h2>
                        
                        ${oneLine ? `<p class="text-[13px] text-zinc-600 dark:text-zinc-300 leading-relaxed mt-1">${escapeHtml(oneLine)}</p>` : ''}
                        
                        ${implication ? `
                        <div class="mt-3 pl-3 border-l-2 border-zinc-200 dark:border-zinc-700">
                            <p class="text-[12px] text-zinc-500 dark:text-zinc-400 italic">" ${escapeHtml(implication)} "</p>
                        </div>
                        ` : ''}
                    </div>
                `;
                
                cols[targetKey].appendChild(el);
            });

            // 데이터가 없는 카테고리 처리
            Object.values(cols).forEach(col => {
                if (col.innerHTML === '') {
                    col.innerHTML = '<p class="text-zinc-400 text-[13px] mt-4 italic">새로운 소식이 없습니다.</p>';
                }
            });
        }

        async function loadFeed() {
            try {
                const response = await fetch(`data/feed.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('Data not found');
                
                const data = await response.json();
                renderFeed(data);
                let status = null;
                try {
                    const statusResponse = await fetch(`data/status.json?t=${new Date().getTime()}`);
                    if (statusResponse.ok) status = await statusResponse.json();
                } catch (_) {}
                renderStatus(status, data);
                
            } catch (error) {
                // Handle error broadly
                document.getElementById('col-news').innerHTML = '<p class="text-red-500 text-sm mt-4">데이터를 불러오지 못했습니다.</p>';
                document.getElementById('feed-status').textContent = '피드 데이터를 불러오지 못했습니다.';
            }
        }

        loadFeed();
    </script>
</body>
</html>
