<!DOCTYPE html>
<html lang="ko" class="antialiased text-gray-900 bg-white dark:bg-zinc-950 dark:text-zinc-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Radar - News & Insights</title>
    <!-- Tailwind CSS (가장 가벼운 CDN 방식) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 고급스러운 타이포그래피를 위한 Pretendard 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <script>
        tailwind.config = {
            darkMode: 'media', // 사용자의 OS 설정(라이트/다크)에 자동으로 맞춤
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
        @media (prefers-color-scheme: dark) {
            ::-webkit-scrollbar-thumb { background: #3f3f46; }
        }
        
        /* 절제된 호버 애니메이션 (Linear 스타일) */
        .arrow-icon {
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.2s ease-out;
        }
        .feed-row:hover .arrow-icon {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-blue-100 selection:text-blue-900 dark:selection:bg-blue-900 dark:selection:text-white">
    <main class="max-w-3xl w-full mx-auto px-6 py-20 flex-1">
        <header class="mb-8 border-b border-zinc-200 dark:border-zinc-800 pb-8">
            <h1 class="text-3xl font-bold tracking-tight mb-3">AI Radar</h1>
            <p class="text-zinc-500 dark:text-zinc-400 text-sm">에이전트, 바이브코딩, 오픈소스 생태계 핵심 브리핑</p>
        </header>

        <!-- 카테고리 필터 탭 -->
        <div id="filter-tabs" class="flex gap-6 mb-8 border-b border-zinc-100 dark:border-zinc-800/80 pb-0 text-sm font-medium overflow-x-auto hide-scrollbar">
            <button data-filter="all" class="filter-btn text-zinc-900 dark:text-zinc-100 border-b-2 border-zinc-900 dark:border-zinc-100 pb-3 -mb-[2px] whitespace-nowrap">전체</button>
            <button data-filter="오픈소스" class="filter-btn text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-300 pb-3 border-b-2 border-transparent hover:border-zinc-300 dark:hover:border-zinc-700 -mb-[2px] transition-all whitespace-nowrap">오픈소스</button>
            <button data-filter="뉴스" class="filter-btn text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-300 pb-3 border-b-2 border-transparent hover:border-zinc-300 dark:hover:border-zinc-700 -mb-[2px] transition-all whitespace-nowrap">뉴스</button>
            <button data-filter="정보" class="filter-btn text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-300 pb-3 border-b-2 border-transparent hover:border-zinc-300 dark:hover:border-zinc-700 -mb-[2px] transition-all whitespace-nowrap">꿀팁/정보</button>
            <button data-filter="커뮤니티" class="filter-btn text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-300 pb-3 border-b-2 border-transparent hover:border-zinc-300 dark:hover:border-zinc-700 -mb-[2px] transition-all whitespace-nowrap">커뮤니티</button>
        </div>

        <div id="feed-container" class="flex flex-col">
            <div class="animate-pulse text-zinc-400 text-sm">최신 데이터를 불러오는 중...</div>
        </div>
    </main>

    <footer class="py-12 text-center text-xs text-zinc-400 dark:text-zinc-600">
        Powered by GitHub Actions & Gemini API
    </footer>

    <script>
        let allFeedData = [];

        function parseSummary(markdown) {
            const lines = markdown.split('\n');
            let oneLine = "";
            let implication = "";
            let category = "뉴스";
            
            lines.forEach(line => {
                if (line.includes('한 줄 요약**:')) oneLine = line.split('**:')[1]?.trim() || line.replace('**- 한 줄 요약**:', '').trim();
                if (line.includes('업무 시사점**:')) implication = line.split('**:')[1]?.trim() || line.replace('**- 업무 시사점**:', '').trim();
                if (line.includes('카테고리:')) category = line.split('카테고리:')[1]?.trim() || "뉴스";
            });
            
            // Clean up category string just in case
            category = category.replace(/\[|\]/g, '').trim();
            
            return { oneLine, implication, category, raw: markdown };
        }

        function relativeTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);
            
            if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)}분 전`;
            if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)}시간 전`;
            return `${Math.floor(diffInSeconds / 86400)}일 전`;
        }

        function renderFeed(data, filter = 'all') {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            const filteredData = filter === 'all' 
                ? data 
                : data.filter(item => parseSummary(item.summary_md).category.includes(filter));

            if (filteredData.length === 0) {
                container.innerHTML = '<p class="text-zinc-500 text-sm mt-8 text-center">해당 카테고리의 뉴스가 없습니다.</p>';
                return;
            }

            filteredData.forEach(item => {
                const parsed = parseSummary(item.summary_md);
                const timeAgo = relativeTime(item.fetched_at);
                
                let domain = "";
                try { domain = new URL(item.url).hostname.replace('www.', ''); } catch(e) {}
                const sourceText = item.source ? `${item.source} • ${domain}` : domain;
                
                const el = document.createElement('a');
                el.href = item.url;
                el.target = "_blank";
                el.rel = "noopener noreferrer";
                el.className = "feed-row group block py-6 border-b border-zinc-100 dark:border-zinc-800/60 hover:bg-zinc-50 dark:hover:bg-zinc-900/40 transition-colors -mx-4 px-4 sm:-mx-6 sm:px-6";
                
                el.innerHTML = `
                    <div class="flex justify-between items-start gap-4">
                        <div class="flex-1 space-y-3">
                            <div class="flex items-center gap-3 text-xs text-zinc-500 dark:text-zinc-400">
                                <span class="px-2 py-0.5 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 font-medium tracking-wide">${parsed.category}</span>
                                <span class="font-semibold text-zinc-700 dark:text-zinc-300 tracking-wide">${sourceText}</span>
                                <span>•</span>
                                <span>${timeAgo}</span>
                            </div>
                            
                            <h2 class="text-xl font-bold leading-snug text-zinc-900 dark:text-zinc-100 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
                                ${item.title.replace(/^\[.*?\]\s*/, '')}
                            </h2>
                            
                            ${parsed.oneLine ? `<p class="text-sm text-zinc-600 dark:text-zinc-300 leading-relaxed">${parsed.oneLine}</p>` : ''}
                            
                            ${parsed.implication ? `
                            <div class="mt-5 pl-4 border-l-2 border-zinc-200 dark:border-zinc-700">
                                <p class="text-sm text-zinc-500 dark:text-zinc-400 italic">" ${parsed.implication} "</p>
                            </div>
                            ` : ''}
                        </div>
                        
                        <div class="mt-1 pt-1 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                            <svg class="w-5 h-5 text-zinc-400 arrow-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                            </svg>
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        async function loadFeed() {
            const container = document.getElementById('feed-container');
            try {
                const response = await fetch(`data/feed.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('Data not found');
                
                allFeedData = await response.json();
                renderFeed(allFeedData, 'all');
                
            } catch (error) {
                container.innerHTML = '<p class="text-red-500 text-sm">데이터를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</p>';
            }
        }

        // 탭 클릭 이벤트 설정
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // UI 업데이트
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.className = "filter-btn text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-300 pb-3 border-b-2 border-transparent hover:border-zinc-300 dark:hover:border-zinc-700 -mb-[2px] transition-all whitespace-nowrap";
                });
                e.target.className = "filter-btn text-zinc-900 dark:text-zinc-100 border-b-2 border-zinc-900 dark:border-zinc-100 pb-3 -mb-[2px] whitespace-nowrap";
                
                // 데이터 필터링
                const filter = e.target.getAttribute('data-filter');
                renderFeed(allFeedData, filter);
            });
        });

        loadFeed();
    </script>
</body>
</html>
