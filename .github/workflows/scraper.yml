name: AI Radar News Scraper

on:
  schedule:
    # 한국 시간(KST) 06:17, 12:17, 18:17, 00:17
    - cron: '17 21,3,9,15 * * *'
  workflow_dispatch: # GitHub 웹사이트에서 수동으로 버튼을 눌러 실행할 수 있게 함

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-radar-feed
  cancel-in-progress: false

jobs:
  scrape-and-summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 패키지 설치 시간 절약을 위해 캐시 사용

      - name: Install Dependencies
        run: python -m pip install -r src/requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      - name: Run Scraper & AI Summarizer
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONUNBUFFERED: 1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/main.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/feed.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Auto-update AI news feed"
            git push
          fi

      - name: Check Feed Health
        run: python src/main.py --check-health

      - name: Resolve Failure Alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --state open --search 'in:title "AI Radar 자동 갱신 실패"' --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "자동 갱신이 정상으로 돌아왔습니다: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

      - name: Open Failure Alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --state open --search 'in:title "AI Radar 자동 갱신 실패"' --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            gh issue create --title 'AI Radar 자동 갱신 실패' --body "실패 실행: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} · 실행 로그와 data/status.json을 확인하세요."
          fi

